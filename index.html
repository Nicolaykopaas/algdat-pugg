<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlgdatMaster</title>
<meta name="description" content="AlgdatMaster: flervalgspugg til TDT4120 Algoritmer og datastrukturer, med fremdrift og leaderboard.">
<script>try{const t=localStorage.getItem("algdat-tema");if(t)document.documentElement.dataset.theme=t;}catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Tre kolonner på store skjermer: navigasjon, innhold, statistikk/leaderboard. Under 1200px havner statistikken under innholdet, under 860px blir navigasjonen en topplinje. */
:root{
  --bg:#fafafb; --panel:#f3f3f6; --surface:#ffffff; --line:#e6e6eb; --line2:#d9d9e0; --fg:#18181b; --muted:#52525b; --faint:#6b6b76;
  --accent:#5b4bf5; --accent-soft:#eeecff; --on-accent:#ffffff; --teal:#0d9488;
  --ok:#0f766e; --ok-bg:#ecfdf7; --ok-line:#5fd3bb; --bad:#be123c; --bad-bg:#fff1f3; --bad-line:#f6a3b4; --mid:#b45309;
  --sans:"Inter",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0e; --panel:#0f0f13; --surface:#131318; --line:#1e1e25; --line2:#2a2a33; --fg:#e8e8eb; --muted:#a1a1aa; --faint:#80808b;
  --accent:#8b7dff; --accent-soft:#1d1a33; --on-accent:#0b0b0e; --teal:#2dd4bf;
  --ok:#5eead4; --ok-bg:#0d1f1b; --ok-line:#1f6f5c; --bad:#fb7185; --bad-bg:#1f0f13; --bad-line:#5c2430; --mid:#fbbf24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0e; --panel:#0f0f13; --surface:#131318; --line:#1e1e25; --line2:#2a2a33; --fg:#e8e8eb; --muted:#a1a1aa; --faint:#80808b;
  --accent:#8b7dff; --accent-soft:#1d1a33; --on-accent:#0b0b0e; --teal:#2dd4bf;
  --ok:#5eead4; --ok-bg:#0d1f1b; --ok-line:#1f6f5c; --bad:#fb7185; --bad-bg:#1f0f13; --bad-line:#5c2430; --mid:#fbbf24; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.mono{font-family:var(--mono)}
kbd{font:500 11px var(--sans);color:var(--faint);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}

/* ramme */
.app{display:grid;grid-template-columns:248px minmax(0,1fr) 300px;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.main{padding:44px clamp(20px,5vw,72px) 56px;min-width:0}
.rpanel{background:var(--panel);border-left:1px solid var(--line);padding:24px 20px;display:flex;flex-direction:column;gap:22px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;padding:2px 8px 16px;letter-spacing:-.01em;background:none;border:0;cursor:pointer;text-align:left}
.lg{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7c6cff,#2dd4bf);flex:none}
.sec{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:14px 8px 6px}
.it{text-decoration:none;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:7px 10px;flex:none;border-radius:8px;color:var(--muted);background:none;border:0;cursor:pointer;text-align:left;font-size:14px}
.it:hover{background:var(--surface);color:var(--fg)} .it.on{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.it:disabled{opacity:.45;cursor:default}
.it .c{font-variant-numeric:tabular-nums;font-size:12px;color:var(--faint)}
.ring{width:18px;height:18px;border-radius:50%;flex:none;background:conic-gradient(var(--teal) var(--p),var(--line2) 0);display:grid;place-items:center}
.ring::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--panel)}
.it.on .ring::after,.it:hover .ring::after{background:var(--surface)}
.foot{margin-top:auto;padding:16px 8px 0;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:8px;font:500 13px var(--mono)}
.av{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 11px var(--sans);text-transform:uppercase}
.ghost{background:none;border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted);cursor:pointer}
.ghost:hover{color:var(--fg);border-color:var(--faint)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.topbar{display:none}

/* knapper og kort */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.crumb{color:var(--faint);font-size:13px} .crumb b{color:var(--muted);font-weight:500}
.h1{font-size:30px;font-weight:600;line-height:1.2;margin:12px 0 24px;text-wrap:balance}

/* oversikt */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end}
.big{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.seg{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}
.seg i{display:block;height:100%} .seg .m{background:var(--teal)} .seg .p{background:var(--mid)} .seg .b{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--faint);margin-top:10px;font-variant-numeric:tabular-nums}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:28px 0}
.act{text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.act:hover{border-color:var(--line2)} .act b{font-size:15px} .act span{font-size:13px;color:var(--faint)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .act.primary span{color:inherit;opacity:.85}
.act:disabled{opacity:.45;cursor:default}
.h2{font-size:13px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin:30px 0 12px}
.grid-t{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:10px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tcard:hover{border-color:var(--line2)}
.tcard .row{justify-content:space-between;width:100%} .tcard .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;position:relative;margin-top:20px}
.chart .col{flex:1 1 0;max-width:36px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.chart .bar{width:100%;border-radius:4px 4px 0 0;background:var(--bad)} .chart .bar.pass{background:var(--teal)}
.chart .lbl{position:absolute;left:0;right:0;text-align:center;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.chart .line{position:absolute;left:0;right:0;border-top:1px dashed var(--faint);opacity:.6}
.chart .linelbl{position:absolute;right:0;font-size:11px;color:var(--faint);transform:translateY(-110%)}
.danger{background:none;border:0;color:var(--faint);font-size:13px;text-decoration:underline;cursor:pointer;padding:0;margin-top:28px}

/* spørsmål */
.prog{height:3px;background:var(--line);border-radius:9px;margin-bottom:28px;overflow:hidden} .prog i{display:block;height:100%;background:var(--accent)}
.back{background:none;border:0;color:var(--faint);cursor:pointer;padding:0;font-size:13px}
.back:hover{color:var(--fg)}
.quiz{max-width:860px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:500 15px var(--mono);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .lab{margin-left:auto;font:500 12px var(--sans)}
.opt.right{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.why{margin-top:20px;border-left:2px solid var(--accent);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:8px;color:var(--muted);line-height:1.6}
.why p{margin:0} .why b{color:var(--fg);font-weight:600}
.verdict{font-weight:600} .verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.src{font-size:12px;color:var(--faint)}
.hint{color:var(--faint);font-size:13px;margin-top:22px}
.pill{display:inline-block;font-weight:600;font-size:13px;padding:4px 12px;border-radius:99px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.no{background:var(--bad-bg);color:var(--bad)}
.review{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.review .item{display:flex;flex-direction:column;gap:4px} .review p{margin:0}

/* høyre kolonne */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.st b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums} .st span{color:var(--faint);font-size:12px}
.sync{font-size:12px;color:var(--faint)}
.lb{display:flex;flex-direction:column}
.lb .r{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.lb .r.me{color:var(--fg);background:var(--surface);border-radius:8px;border-bottom-color:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.lb .rank{color:var(--faint)} .lb .nm{font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sub{grid-column:2 / -1;font-size:11px;color:var(--faint);margin-top:-4px}
.err{color:var(--bad);font-size:13px;margin:0}

/* innlogging */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.login label{font-weight:600;font-size:14px;margin-top:8px}
.login input{font:500 16px var(--mono);padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);width:100%}
.login input:focus{outline:2px solid var(--accent);outline-offset:1px}

@media (max-width:1199px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .rpanel{grid-column:2;border-left:0;border-top:1px solid var(--line);background:none;padding:28px clamp(20px,5vw,72px) 48px}
  .rpanel .rin{max-width:640px;display:flex;flex-direction:column;gap:22px}
}
@media (max-width:859px){
  .app{display:block}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
  .topbar .logo{padding:0}
  .main{padding:24px 16px 40px}
  .rpanel{padding:24px 16px 40px}
  .app.fokus .rpanel{display:none}
  .h1{font-size:23px}
  .big{font-size:44px}
  .hero{grid-template-columns:1fr;gap:12px}
}
@media (prefers-reduced-motion: no-preference){.seg i,.prog i{transition:width .3s}}
</style>

["Kjøretider","Kjøretiden til BFS med nabolister?",["O(V + E)","O(V²)","O(E lg V)","O(V · E)"],"Hver node legges i køen maks én gang, og hver naboliste gås gjennom én gang.","aug 2026"],

["Kjøretider","Kjøretiden til Dijkstra med binær min-haug?",["O((V + E) lg V)","O(V · E)","O(V + E)","O(V³)"],"V Extract-Min og opptil E Decrease-Key, hver koster O(lg V).",""],

["Kjøretider","Kjøretiden til Prim med binær min-haug?",["O(E lg V)","O(V + E)","O(V³)","O(E²)"],"Samme mønster som Dijkstra: Extract-Min og Decrease-Key i en binær haug.",""],
["Kjøretider","Kjøretiden til DAG-Shortest-Paths?",["Θ(V + E)","Θ(V lg V + E)","Θ(V · E)","Θ(V²)"],"Topologisk sortering (Θ(V + E)) og så én slakking per kant.",""],
["Kjøretider","Kjøretiden til Edmonds-Karp?",["O(V E²)","O(E · |f*|)","O(V² E²)","O(V E lg V)"],"Antall forøkende stier er O(VE), og hver finnes med BFS på O(E). O(E·|f*|) er generell Ford-Fulkerson med heltallskapasiteter.",""],
["Kjøretider","Kjøretiden til Build-Max-Heap?",["O(n)","O(n lg n)","O(lg n)","O(n²)"],"Lineær, fordi de fleste nodene ligger nær bunnen og bare synker kort.","des 2025"],
["Kjøretider","Kjøretiden til Heapsort?",["O(n lg n) i alle tilfeller","O(n) i beste tilfelle","O(n²) i verste tilfelle","Θ(n + k)"],"Build-Max-Heap O(n), deretter n − 1 Max-Heapify à O(lg n).",""],
["Kjøretider","Kjøretiden til Insertion-Sort?",["O(n²) og Ω(n)","Θ(n²)","Θ(n lg n)","O(n lg n) og Ω(n)"],"Beste tilfelle: allerede sortert gir Θ(n). Verste: baklengs sortert gir Θ(n²). Ikke ett Θ for alle tilfeller.","des 2023 (oppgave 1a), aug 2026"],
["Kjøretider","Kjøretiden til Merge-Sort?",["Θ(n lg n) i alle tilfeller","Θ(n) i beste tilfelle","Θ(n²) i verste tilfelle","Θ(n lg² n)"],"Samme rekurrens T(n) = 2T(n/2) + Θ(n) uansett input.",""],
["Kjøretider","Kjøretiden til Counting-Sort?",["Θ(n + k)","Θ(n lg n)","Θ(n · k)","Θ(k lg n)"],"Én gjennomgang av A (n) og noen gjennomganger av tellearrayet C (k).",""],
["Kjøretider","Kjøretiden til Radix-Sort med d sifre i base k?",["Θ(d(n + k))","Θ(n lg n)","Θ(n · k · d)","Θ(d · n lg n)"],"d runder med en stabil Counting-Sort på Θ(n + k) hver.",""],
["Kjøretider","Forventet kjøretid til Bucket-Sort med uniformt fordelt input?",["Θ(n)","Θ(n lg n)","Θ(n²)","Θ(n + k)"],"Forventet få elementer per bøtte. Verste tilfelle er Θ(n²) hvis alt havner i samme bøtte.",""],
["Kjøretider","Forventet kjøretid til Randomized-Select?",["Θ(n)","Θ(n lg n)","Θ(lg n)","Θ(n²)"],"Rekurserer bare på én side: n + n/2 + n/4 + … = Θ(n). Verste tilfelle er Θ(n²).",""],
["Kjøretider","Amortisert kjøretid til Table-Insert i en dynamisk tabell med dobling?",["Θ(1)","Θ(lg n)","Θ(n)","Θ(n lg n)"],"De dyre kopieringene skjer sjeldnere og sjeldnere. Totalt Θ(n) for n innsettinger.","aug 2024 (oppgave 6)"],

["Kjøretider","Kjøretiden til bottom-up stavkapping (rod cutting) for lengde n?",["Θ(n²)","Θ(n)","Θ(2^n)","Θ(n lg n)"],"For hver lengde j prøves j mulige første kutt: 1 + 2 + … + n.",""],

["Kjøretider","Kjøretiden for m operasjoner på disjunkte mengder med union by rank og stikomprimering?",["O(m α(n))","O(m lg n)","O(m n)","O(m)"],"α er den inverse Ackermann-funksjonen, i praksis ≤ 4.",""],
["Kjøretider","Kjøretiden til Topologisk sortering?",["Θ(V + E)","Θ(V lg V)","Θ(V²)","Θ(E lg E)"],"DFS, og så legges hver node først i en lenket liste når den er ferdig.",""],

// ---------- Grafer ----------
["Grafer","Hva kreves for at Dijkstra skal gi riktig svar?",["Ingen kanter med negativ vekt","Ingen negative sykler","At grafen er asyklisk","At grafen er urettet"],"En node som er hentet ut, regnes som ferdig. En negativ kant senere kunne gitt den en kortere vei.",""],
["Grafer","Hvorfor kan Dijkstra gi feil svar med negative kanter?",["En node som er tatt ut av køen, kan senere få kortere avstand via en negativ kant, men oppdateres ikke","Prioritetskøen støtter ikke negative nøkler","Algoritmen går i uendelig løkke","Den slakker bare kanter én gang totalt"],"Grådighetsargumentet («den minste ikke-ferdige avstanden er endelig») holder bare når alle kantvekter er ≥ 0.","des 2025"],

["Asymptotikk","Stemmer 2^(n+1) = O(2^n)?",["Ja: 2^(n+1) = 2 · 2^n","Nei, eksponenten er større","Bare for n > 1","Nei, bare Ω"],"2^(n+1) = 2 · 2^n, så med c = 2 holder 2^(n+1) ≤ c · 2^n for alle n. Å legge en konstant til eksponenten gir bare en konstant faktor, og den ignorerer O-notasjonen.","aug 2026"],
["Asymptotikk","Stemmer 4^n = O(2^n)?",["Nei: 4^n = 2^n · 2^n, og faktoren 2^n er ingen konstant","Ja, begge er eksponentielle","Ja, konstanten er 2","Bare for små n"],"4^n = (2²)^n = 2^n · 2^n. Skulle 4^n ≤ c · 2^n holde, måtte 2^n ≤ c for alle store n, og det går ikke. Sammenlign med 2^(n+1) = 2 · 2^n, der faktoren er konstant. Å legge en konstant til eksponenten gir en konstant faktor, men å endre grunntallet gjør ikke det.","aug 2026"],
["Asymptotikk","To av O(n³), Ω(n³) og Θ(n³) stemmer. Hvilken velger du?",["Θ(n³): to av dem stemmer, så alle tre gjør det, og Θ sier mest","O(n³)","Ω(n³)","Det kan ikke avgjøres"],"Θ(n³) betyr O(n³) og Ω(n³) samtidig. Uansett hvilke to som stemmer, har du både O og Ω, og dermed Θ. Θ er det mest presise svaret, så det er det du velger.","des 2025"],
["Asymptotikk","Tre slags gjennomsnittlig kjøretid. Hva tar man gjennomsnittet av?",["Over inputfordelingen (average case), over algoritmens tilfeldige valg (forventet) og over en sekvens operasjoner (amortisert)","Beste, verste og median","Over n, lg n og n²","Over tid, minne og antall sammenligninger"],"Average case: snitt over alle mulige input med en antatt fordeling, f.eks. Quicksort på en tilfeldig permutasjon. Forventet kjøretid: algoritmen bruker selv tilfeldighet, og snittet tas over dens egne tilfeldige valg for hvert input, f.eks. Randomized-Quicksort. Amortisert: ingen sannsynlighet, men en garantert snittkostnad per operasjon over en hel sekvens, f.eks. dynamisk tabell med dobling.","des 2024 (oppgave 14)"],
["Asymptotikk","Hvor mye øker m? «for i: m++; for j: m++; for k: m++» nøstet, alle 1…n",["Θ(n³)","Θ(n)","Θ(n² lg n)","Θ(3n)"],"Den ytterste m++ kjøres n ganger, den midterste n · n ganger og den innerste n · n · n ganger. Totalt n + n² + n³, og det største leddet dominerer: Θ(n³).","des 2025"],
["Asymptotikk","k = 1; for i = 1 to n: m = m + k; k = k + k. Hvor mye øker m?",["Θ(2^n)","Θ(n)","Θ(n²)","Θ(n lg n)"],"k dobles hver runde: 1, 2, 4, …, 2^(n−1). m øker med summen 1 + 2 + 4 + … + 2^(n−1) = 2^n − 1. I en geometrisk rekke dominerer det siste leddet, så svaret er Θ(2^n).","des 2025"],
["Asymptotikk","Brute force på et passord med n tegn fra et alfabet av størrelse k?",["Θ(k^n) forsøk","Θ(n^k)","Θ(n · k)","Θ(n!)"],"Hver av de n posisjonene kan ha k tegn, uavhengig av hverandre: k · k · … · k = k^n kombinasjoner. Å prøve alle tar derfor Θ(k^n) forsøk i verste tilfelle.","aug 2023 (oppgave 9)"],
["Asymptotikk","for i = 1 to n: for j = 1 to n: if A[i] < A[j]: swap. Kjøretid?",["Θ(n²)","Θ(n lg n)","Θ(n)","O(n²), men Ω(n)"],"Begge løkkene går fra 1 til n hver gang, uansett hva som står i A. Sammenligningen kjøres derfor nøyaktig n² ganger, så kjøretiden er Θ(n²) for alle input, ikke bare i verste tilfelle.","aug 2023 (oppgave 1)"],

const likeVerdier = v => LIKE.find(par => par.includes(v)) || [v];
function feilsvar(riktig, pool, unngå = []) {
  // De nærmeste verdiene i poolen er de mest troverdige feilsvarene.
  const sperret = new Set([...likeVerdier(riktig), ...unngå]), i = pool.indexOf(riktig);
  return pool.filter(v => !sperret.has(v)).sort((a, b) => Math.abs(pool.indexOf(a) - i) - Math.abs(pool.indexOf(b) - i)).slice(0, 3);
}
ALG.forEach(a => {
  const pool = POOL[a.p], kort = a.kort || a.navn;
  if (a.alle) {
    const [v, why] = a.alle, f = feilsvar(v, pool), mindre = f.find(x => pool.indexOf(x) < pool.indexOf(v));
    // Det fjerde alternativet er den vanlige misforståelsen at beste tilfelle er raskere enn verste.
    const blandet = mindre ? `${mindre} i beste og ${v} i verste tilfelle` : `${v} i beste og ${f[2]} i verste tilfelle`;
    Q.push([a.t, `${a.navn}: kjøretid i beste, gjennomsnittlige og verste tilfelle?`,
      [`${v} i alle tilfeller`, `${f[0]} i alle tilfeller`, `${f[1]} i alle tilfeller`, blandet], why, ""]);
  }
  [["beste", "kjøretid i beste tilfelle"], ["snitt", a.snittNavn || "kjøretid i gjennomsnittlig tilfelle"], ["verste", "kjøretid i verste tilfelle"]].forEach(([k, navn]) => {
    if (!a[k]) return;
    const [v, why, unngå] = a[k];
    Q.push([a.t, `${a.navn}: ${navn}?`, [v, ...feilsvar(v, pool, unngå)], why, ""]);
  });
  if (a.minne) {
    const [v, why, unngå] = a.minne;
    Q.push([a.t, a.minneQ || `${a.navn}: hvor mye ekstra minne trengs i verste tilfelle, utover input?`, [v, ...feilsvar(v, POOL[a.mp || "n"], unngå)], why, ""]);
  }
  if (a.stabil) {
    const [ja, why] = a.stabil, J = "Ja, like elementer beholder rekkefølgen sin", N = "Nei, like elementer kan bytte rekkefølge";
    Q.push([a.t, `Er ${kort} stabil?`, ja ? [J, N] : [N, J], why, ""]);
  }
});

    </div>
    <div class="row" style="justify-content:space-between"><h2 class="h2" style="margin:0">Temaer</h2><span class="faint" style="font-size:13px">Svakest nå: ${esc(svakest[0])}</span></div>
    <div class="grid-t" style="margin-top:12px">${temaer.map(te => {
      const ix = alle.filter(i => Q[i][0] === te), tt = telling(ix);
      return `<button class="tcard" data-tema="${esc(te)}"><span class="row"><b style="font-weight:600">${esc(te)}</b><span class="n">${tt.m} / ${ix.length}</span></span>${seg(tt, ix.length)}</button>`;
    }).join("")}</div>
    <h2 class="h2">Dine prøveeksamener</h2>
    ${eks.length ? `<div class="card"><div class="chart">
      <div class="line" style="bottom:${EKS_KRAV / EKS_N * 100}%"></div><div class="linelbl" style="bottom:${EKS_KRAV / EKS_N * 100}%">krav ${EKS_KRAV}</div>
      ${eks.map(e => `<div class="col" title="${e.d}: ${e.r}/${EKS_N}"><span class="lbl" style="bottom:calc(${Math.max(e.r / EKS_N * 100, 2)}% + 2px)">${e.r}</span><div class="bar ${e.r >= EKS_KRAV ? "pass" : ""}" style="height:${Math.max(e.r / EKS_N * 100, 2)}%"></div></div>`).join("")}
    </div><p class="faint" style="font-size:12px;margin:10px 0 0">Siste ${eks.length} prøver, eldst til venstre.</p></div>`
    : `<p class="faint" style="margin:0">Ingen prøver tatt ennå. Resultatene havner her som søyler mot kravet på ${EKS_KRAV} av ${EKS_N}.</p>`}
    <button class="danger" id="reset">Nullstill fremgangen min</button>`);
  $("#reset").onclick = () => {
    const b = $("#reset");
    if (b.dataset.sure) { D = { st: {}, eks: [], dager: [] }; lagre(); hjem(); }
    else { b.dataset.sure = 1; b.textContent = "Trykk igjen for å slette alt"; }
  };
  try { lbRader = await hentLeaderboard(); lbFeil = false; } catch { lbFeil = true; }
  const el = $("#lb"); if (el) el.innerHTML = lbHtml();
}

// ---------- økt ----------
let økt = null;
function startØkt(type, tema) {
  let ix = Q.map((_, i) => i);
  if (tema) ix = ix.filter(i => Q[i][0] === tema);
  if (type === "eks") ix = shuffle(ix).slice(0, EKS_N);
  else if (type === "bom") ix = shuffle(ix.filter(i => status(i) === "b"));
  else { const rang = { b: 0, u: 1, p: 2, m: 3 }; ix = shuffle(shuffle(ix).sort((a, b) => rang[status(a)] - rang[status(b)]).slice(0, 15)); }
  økt = { type, tema, ix, i: 0, riktig: 0, svar: [], låst: false };
  vis();
}
const øktAktiv = ø => ø.type === "øv" ? "øv:" + (ø.tema || "") : ø.type;
function vis() {
  const ø = økt;
  if (ø.i >= ø.ix.length) return slutt();
  const idx = ø.ix[ø.i], [te, sp, alts, , kilde] = Q[idx];
  ø.låst = false; ø.ordning = shuffle(alts.map((_, k) => k));
  const tittel = ø.type === "eks" ? "Prøveeksamen" : ø.type === "bom" ? "Repeter feil" : (ø.tema || "Blandet");
  const st = status(idx);
  ramme(`<div class="quiz">
    <div class="prog"><i style="width:${ø.i / ø.ix.length * 100}%"></i></div>
    <div class="row" style="justify-content:space-between"><button class="back" id="back">← Avslutt</button><span class="faint" style="font-size:13px">${st === "b" ? "Feil sist" : st === "m" ? "Mestret" : st === "u" ? "Nytt" : "På vei"}</span></div>
    <div class="crumb" style="margin-top:14px">${esc(tittel)}${ø.type !== "øv" || !ø.tema ? " / " + esc(te) : ""}${kilde ? ` / <b>Eksamen ${esc(kilde)}</b>` : ""} · ${ø.i + 1} av ${ø.ix.length}</div>
    <h1 class="h1">${esc(sp)}</h1>
    <div class="opts">${ø.ordning.map((k, n) => `<button class="opt" data-k="${k}"><kbd>${n + 1}</kbd><span>${esc(alts[k])}</span></button>`).join("")}</div>
    <div class="why" id="why" role="status" hidden></div>
    <p class="hint">Trykk <kbd>1</kbd>–<kbd>4</kbd> for å svare og <kbd>Enter</kbd> for neste.</p></div>`, { aktiv: øktAktiv(ø), fokus: true });
  $("#back").onclick = hjem;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => svar(+b.dataset.k));
}
function svar(k) {
  const ø = økt; if (ø.låst) return; ø.låst = true;
  const idx = ø.ix[ø.i], [, , alts, why, kilde] = Q[idx], ok = k === 0;
  if (ok) ø.riktig++;
  ø.svar.push({ idx, k, ok });
  registrer(idx, ok);
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true; const bk = +b.dataset.k;
    if (bk === 0) { b.classList.add("right"); b.insertAdjacentHTML("beforeend", `<span class="lab">Riktig</span>`); }
    else if (bk === k) { b.classList.add("wrong"); b.insertAdjacentHTML("beforeend", `<span class="lab">Ditt svar</span>`); }
  });
  const s = D.st[idx], w = $("#why"); w.hidden = false;
  w.innerHTML = `<p class="verdict ${ok ? "ok" : "no"}">${ok ? (s.c >= MESTRET ? "Riktig, og nå mestret." : `Riktig. ${MESTRET - s.c} til på rad for å mestre.`) : "Feil."}</p>
    <p><b>Riktig svar:</b> ${esc(alts[0])}</p><p><b>Forklaring:</b> ${esc(why)}</p><p class="src">Kilde: ${esc(kildeTekst(kilde))}</p>
    <div><button class="btn primary" id="next">Neste →</button></div>`;
  $("#next").onclick = () => { ø.i++; vis(); };
  $("#next").focus();
}
function slutt() {
  const ø = økt, n = ø.ix.length;
  if (ø.type === "eks" && !ø.lagret) { ø.lagret = true; D.eks.push({ d: idag(), r: ø.riktig }); lagre(); }
  const feil = ø.svar.filter(s => !s.ok), bestått = ø.riktig >= EKS_KRAV;
  ramme(`<div class="quiz">
    <div class="crumb">${ø.type === "eks" ? "Prøveeksamen" : "Runde"} ferdig</div>
    <div class="big" style="margin-top:14px">${ø.riktig} / ${n}</div>
    <div class="row" style="margin-top:12px">${ø.type === "eks" ? `<span class="pill ${bestått ? "ok" : "no"}">${bestått ? "Bestått" : "Ikke bestått"}</span><span class="faint">Krav: ${EKS_KRAV} av ${EKS_N}</span>`
      : `<span class="faint">${Math.round(ø.riktig / n * 100)} % riktig denne runden</span>`}</div>
    <div class="row" style="margin-top:22px"><button class="btn primary" id="again">${ø.type === "eks" ? "Ny prøve" : "Ny runde"}</button><button class="btn" id="home">Til oversikten</button></div>
    ${feil.length ? `<h2 class="h2">Det du bommet på</h2><div class="review">${feil.map(s => { const [te, sp, alts, why, kilde] = Q[s.idx];
      return `<div class="card item"><span class="crumb">${esc(te)}</span><p style="font-weight:600">${esc(sp)}</p><p style="color:var(--bad)">Du svarte: <span class="mono">${esc(alts[s.k])}</span></p><p style="color:var(--ok)">Riktig: <span class="mono">${esc(alts[0])}</span></p><p class="muted">${esc(why)}</p><p class="src">Kilde: ${esc(kildeTekst(kilde))}</p></div>`; }).join("")}</div>` : ""}
  </div>`, { aktiv: øktAktiv(ø) });
  $("#home").onclick = hjem;
  $("#again").onclick = () => startØkt(ø.type, ø.tema);
}
document.addEventListener("keydown", e => {
  if (!økt || økt.i >= økt.ix.length) return;
  if (!økt.låst && /^[1-4]$/.test(e.key)) { const b = document.querySelectorAll(".opt")[+e.key - 1]; if (b) b.click(); }
  else if (økt.låst && e.key === "Enter" && $("#next") && document.activeElement !== $("#next")) $("#next").click();
});

(async () => { if (bruker) { await lastBruker(bruker); hjem(); } else login(); })();
</script>
</body>
</html>
